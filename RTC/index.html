<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<style>
.krushi-nav {
  background: linear-gradient(135deg, #00796B 0%, #00897B 100%);
  padding: 15px 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.krushi-nav-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
}
.krushi-nav-home {
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 6px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.krushi-nav-home:hover {
  background-color: rgba(255, 255, 255, 0.2);
  transform: translateX(2px);
}
.krushi-nav-title {
  color: white;
  font-size: 16px;
  font-weight: 500;
}
</style>
    <section class="chat__section"> 
        <div class="brand">
            <h1>Real-Time Chat</h1>
        </div>
        <div class="message__area"></div>
        <div>
            <textarea id="textarea" cols="30" rows="1" placeholder="Write a message..."></textarea>
        </div>
    </section>

    <script src="client.js"></script>
</body>
</html>
