<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    @import url('../../fonts.css');
    
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body and background styles */
    body {
      font-family: 'Adani Regular', sans-serif;
      background-image: url('./images/BACKGROUND.jpg'); /* Replace with your image path */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #333;
    }

    /* Hero section styles */
    .hero-section {
      /* background: rgba(0, 0, 0, 0.5); Dark overlay for readability */
      color: rgb(0, 0, 0);
      text-align: center;
      padding: 100px 20px;
      background-size: cover;
      background-position: center;
    }

    .hero-section h1 {
      font-size: 3.5em;
      margin-bottom: 20px;
      font-family: 'Adani Bold', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
    }

    .hero-section p {
      font-size: 1.2em;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .explore-btn {
      padding: 15px 40px;
      font-size: 1.3em;
      background-color: #00796B;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, background-color 0.3s;
    }

    .explore-btn:hover {
      background-color: #00796B;
      transform: translateY(-5px);
    }

    .explore-btn:focus {
      outline: none;
    }

    /* Media Queries for responsive design */
    @media (max-width: 768px) {
      .hero-section h1 {
        font-size: 2.5em;
      }

      .hero-section p {
        font-size: 1em;
      }

      .explore-btn {
        font-size: 1.2em;
        padding: 12px 30px;
      }
    }

  </style>
</head>
