<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<style>
.krushi-nav {
  background: linear-gradient(135deg, #00796B 0%, #00897B 100%);
  padding: 15px 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.krushi-nav-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
}
.krushi-nav-home {
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 6px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.krushi-nav-home:hover {
  background-color: rgba(255, 255, 255, 0.2);
  transform: translateX(2px);
}
.krushi-nav-title {
  color: white;
  font-size: 16px;
  font-weight: 500;
}
</style>

    <div class="calculator">
        <h1>EMI Calculator</h1>
        <form id="emiForm">
            <label for="loanAmount">Loan Amount (₹):</label>
            <input type="number" id="loanAmount" required>

            <label for="interestRate">Interest Rate (% per annum):</label>
            <input type="number" id="interestRate" step="0.01" required> <!-- Allow float values -->

            <label for="loanTenure">Loan Tenure (in months):</label>
            <input type="number" id="loanTenure" required>

            <button type="submit">Calculate EMI</button>
        </form>

        <div id="result">
            <h2>Your EMI: <span id="emiValue"></span></h2>
            <h2>Total Interest: <span id="totalInterest"></span></h2>
            <h2>Total Amount: <span id="totalAmount"></span></h2>
        </div>

        <div id="breakdown">
            <h2>Month-by-Month Breakdown</h2>
            <div class="table-container">
                <table id="breakdownTable">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Principal (₹)</th>
                            <th>Interest (₹)</th>
                            <th>Remaining Balance (₹)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
